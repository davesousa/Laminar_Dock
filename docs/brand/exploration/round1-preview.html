<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laminar logo concepts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
  :root { --bg: #0b0c10; --ink: #f2f2f4; --soft: rgba(242,242,244,.6); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Geist, system-ui, sans-serif; padding: 40px 24px 80px; }
  h1 { font-weight: 600; letter-spacing: -.03em; font-size: 32px; margin: 0 0 6px; }
  p.lead { color: var(--soft); margin: 0 0 36px; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .card { border-radius: 22px; background: #14161c; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); padding: 22px; }
  .card h2 { margin: 0 0 2px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .card .why { margin: 0 0 18px; color: var(--soft); font-size: 14px; line-height: 1.45; min-height: 3em; }
  .big { width: 168px; height: 168px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
  .sizes { display: flex; align-items: end; gap: 18px; margin: 18px 0; }
  .sizes img { display: block; }
  .light { background: #f3f3f6; border-radius: 14px; padding: 14px; display: flex; align-items: end; gap: 18px; }
  .lockup { display: flex; align-items: center; gap: 12px; margin-top: 18px; font-weight: 600; font-size: 24px; letter-spacing: -.03em; }
  .lockup img { width: 36px; height: 36px; }
  .px { font-size: 11px; color: var(--soft); text-align: center; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Laminar logo concepts</h1>
  <p class="lead">Four different directions, each shown at app-icon size, at 64, 32 and 16 px (favicon sizes), on light, and as a lockup with the wordmark. Pick one direction; I'll refine it and export the final files.</p>
  <div class="grid" id="grid"></div>
<script>
const C = [
  ['a-strata', 'A. Strata', 'Three layers sliding past each other: laminar flow, and a stack of glass panes. Calm, very readable at 16 px.'],
  ['b-magnify', 'B. Magnify', 'The dock\'s signature moment as a mark: one icon lifted by the pointer, with its running dot. Most ownable.'],
  ['c-flow', 'C. Flow', 'Two bold streamlines. The closest to today\'s logo, made simpler and heavier so it survives small sizes.'],
  ['d-shelf', 'D. Shelf', 'An L whose foot becomes the dock shelf, with an icon resting on it. A monogram that also works as a letter.'],
];
document.getElementById('grid').innerHTML = C.map(([f, n, w]) => `
  <div class="card">
    <h2>${n}</h2><p class="why">${w}</p>
    <img class="big" src="concepts/${f}.svg" alt="">
    <div class="sizes">${[64, 32, 16].map(s => `<div><img src="concepts/${f}.svg" width="${s}" height="${s}" alt=""><div class="px">${s}</div></div>`).join('')}</div>
    <div class="light">${[64, 32, 16].map(s => `<img src="concepts/${f}.svg" width="${s}" height="${s}" alt="">`).join('')}</div>
    <div class="lockup"><img src="concepts/${f}.svg" alt="">Laminar</div>
  </div>`).join('');
</script>
</body>
</html>
